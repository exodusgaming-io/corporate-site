name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # General Sans is downloaded at build (scripts/fetch-fonts.mts); keep it between runs.
      - uses: actions/cache@v6
        with:
          path: app/fonts/general-sans
          key: general-sans-${{ hashFiles('scripts/fetch-fonts.mts') }}
      - run: npm run lint
      - run: npm run build
        env:
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
